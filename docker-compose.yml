
services:
  mqtt-usb-hub:
    build: .
    image: ${IMAGE_NAME:-your-docker-registry/mqtt-usb-hub:latest}
    container_name: ${CONTAINER_NAME:-mqtt-usb-hub-control}
    ports:
      - "49152:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 如果需要持久化配置，可以挂载配置文件（避免与 /usr/share/nginx/html 的只读挂载冲突）
      - ./config:/usr/share/nginx/html_config:ro
      # 本地前端静态资源，包含 ui_control.html, ui_control.js, ui_control.css
      - ./resource:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mqtt-usb-hub.rule=Host(`your-domain.com`)"
      - "traefik.http.services.mqtt-usb-hub.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: mqtt-usb-hub-network


